appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "http://.*:8081"
          timeout: 120000
      - tapOn: "http://.*:8081"
- runFlow:
    when:
      visible: "http://.*:8081"
    commands:
      - tapOn: "http://.*:8081"
- extendedWaitUntil:
    notVisible: "http://.*:8081"
    timeout: 120000
- openLink: "readyoufife-dev://question-bank/sentences900/study/sentence900-3%E7%BA%A7/sentence900-3%E7%BA%A7-main?cardId=sentence900-main-001"
- runFlow:
    when:
      platform: iOS
      visible: "打开|Open"
    commands:
      - tapOn:
          point: "68%,54%"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
- tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          point: "90%,48%"
- assertVisible:
    id: "integrated-record-button"
- tapOn:
    id: "integrated-record-button"
- extendedWaitUntil:
    visible: "点击停止.*0:0[1-9]"
    timeout: 15000
- tapOn: "停止录音"
- assertVisible: "点击重新录音"
- assertVisible: "我的回答"
- assertVisible: "回放我的录音"
- tapOn: "转写"
- assertVisible: "Audio lifecycle test transcript."
