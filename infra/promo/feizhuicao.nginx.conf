# Standalone promotional site. Keep the existing default/IP study site unchanged.
server {
    listen 80;
    server_name feizhuicao.com www.feizhuicao.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://feizhuicao.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name feizhuicao.com www.feizhuicao.com;
    ssl_certificate /etc/letsencrypt/live/feizhuicao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feizhuicao.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host = www.feizhuicao.com) { return 301 https://feizhuicao.com$request_uri; }
    root /var/www/feizhuicao/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "microphone=(), camera=(), geolocation=()" always;
    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /promo { return 301 https://feizhuicao.com/$is_args$args; }
    location = /promo/ { return 301 https://feizhuicao.com/$is_args$args; }
    location = /promo/index.html { return 301 https://feizhuicao.com/$is_args$args; }
    # Preserve paths embedded in the reviewed static React snapshot.
    location ^~ /promo/legacy/static/ {
        alias /var/www/feizhuicao/current/legacy/static/;
        expires 1y;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /promo/ { alias /var/www/feizhuicao/current/; }
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location ^~ /api/ { return 410; }
    location ^~ /question-bank-assets/ { return 410; }
    location ^~ /web-content/ { return 410; }
    location / { try_files $uri =404; }
}
