services:
  auth:
    environment:
      # This overlay is for an isolated internal-TestFlight Auth deployment only.
      # Never compose it into the production Supabase stack.
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      # Match production: the API owns each purpose's 60s resend cooldown.
      GOTRUE_SMS_MAX_FREQUENCY: "1s"
      GOTRUE_SMS_OTP_EXP: "300"
      GOTRUE_SMS_OTP_LENGTH: "6"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_CURRENT_PASSWORD: "true"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
      GOTRUE_SMS_TEST_OTP: "${ICAO_TESTFLIGHT_SMS_TEST_OTP:?set an allowlisted phone-to-OTP mapping}"
      GOTRUE_SMS_TEST_OTP_VALID_UNTIL: "${ICAO_TESTFLIGHT_SMS_TEST_OTP_VALID_UNTIL:?set an ISO-8601 expiry}"
