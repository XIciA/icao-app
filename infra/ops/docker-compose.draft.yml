services:
  ops-api:
    build:
      context: ../..
      dockerfile: infra/ops/Dockerfile.api
    image: icao-ops-api:stage3a
    restart: unless-stopped
    networks:
      - supabase
    ports:
      - "127.0.0.1:3102:3102"
    env_file:
      - /opt/icao/runtime/ops-api/.env
    environment:
      OPS_ENABLED: "1"
      OPS_HOST: "0.0.0.0"
      OPS_PORT: "3102"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3102/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ops-web:
    build:
      context: ../..
      dockerfile: infra/ops/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4180:8080"
    read_only: true
    tmpfs:
      - /config
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  supabase:
    external: true
    name: supabase_default
