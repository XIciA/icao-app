name: icao-ops

services:
  ops-api:
    image: icao-ops-api:production
    container_name: icao-ops-api
    restart: unless-stopped
    networks:
      - supabase
    ports:
      - 127.0.0.1:3102:3102
    env_file:
      - /opt/icao/runtime/ops-api/.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3102/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ops-web:
    image: icao-ops-web:production
    container_name: icao-ops-web
    restart: unless-stopped
    ports:
      - 127.0.0.1:4180:8080
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official Caddy binary carries this file capability; keep it in the
    # bounding set so exec succeeds even though this service listens on 8080.
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  supabase:
    external: true
    name: supabase_default
