packages:
  - apps/*
  - packages/*
  - services/*
overrides:
  'ini@<1.3.6': 1.3.8
allowBuilds:
  # The published package already includes dist/. Its postinstall only selects
  # legacy TypeScript versions for Node 10/12 and is unnecessary on Node 22+.
  '@alicloud/openapi-core': false
  esbuild: true
patchedDependencies:
  expo-modules-core@55.0.25: patches/expo-modules-core@55.0.25.patch
  react-native-reanimated@4.2.1: patches/react-native-reanimated@4.2.1.patch
  react-native-track-player@4.1.2: patches/react-native-track-player@4.1.2.patch
