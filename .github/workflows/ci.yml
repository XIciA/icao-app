name: Mainline CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository and EdgeOne checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_ICAO_API_URL: https://api.readyoufife.com
      EXPO_PUBLIC_SUPABASE_URL: https://cloud.readyoufife.com
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_value
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # The Web-freeze gate verifies an immutable reviewed ancestor and
          # must not silently fall back when the default shallow clone omits it.
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL constraint-test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Run database authority constraint tests
        run: pnpm --filter @icao/api test:commerce-db
      - name: Run repository checks
        run: pnpm check:ci
      - name: Verify EdgeOne production export
        run: pnpm check:web:edgeone
